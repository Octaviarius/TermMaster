version: 1
type: termaster.settings-schema
description: Workspace preview settings
content:
  $schema: http://json-schema.org/draft-07/schema#
  type: object
  title: Workspace
  additionalProperties: false
  required:
  - name
  - file
  - sessions
  - plugins
  - scripts
  - autosave
  - interval
  x-groups:
  - id: identity
    title: Workspace
    order: 0
  - id: directories
    title: Directories
    order: 1
  - id: saving
    title: Saving
    order: 2
  properties:
    name:
      type: string
      title: Display name
      default: Firmware lab
      x-group: identity
      x-settings-path: identity/name
      minLength: 1
      maxLength: 256
      x-order: 0
    file:
      type: string
      title: Workspace file
      default: F:/Projects/FirmwareLab/Lab.termaster
      x-group: identity
      x-settings-path: identity/file
      readOnly: true
      x-order: 1
    sessions:
      type: string
      title: Session directory
      default: sessions/
      x-group: directories
      x-settings-path: directories/sessions
      readOnly: true
      x-order: 2
    plugins:
      type: string
      title: Additional plugins
      default: plugins/
      x-group: directories
      x-settings-path: directories/plugins
      x-order: 3
    scripts:
      type: string
      title: User scripts
      default: scripts/
      x-group: directories
      x-settings-path: directories/scripts
      x-order: 4
    autosave:
      type: boolean
      title: Save changes automatically
      default: true
      x-group: saving
      x-settings-path: saving/automatic
      x-order: 5
    interval:
      type: integer
      title: Save interval (seconds)
      default: 60
      x-group: saving
      x-settings-path: saving/interval
      minimum: 5
      maximum: 600
      x-order: 6
