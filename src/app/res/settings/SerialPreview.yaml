version: 1
type: termaster.settings-schema
description: Serial port preview settings
content:
  $schema: http://json-schema.org/draft-07/schema#
  type: object
  title: Serial port
  additionalProperties: false
  required:
  - port
  - baudRate
  - dataBits
  - parity
  - stopBits
  - flowControl
  - dtr
  - rts
  - readBuffer
  - timeout
  x-groups:
  - id: connection
    title: Connection
    order: 0
  - id: line
    title: Line parameters
    order: 1
  - id: advanced
    title: Advanced
    order: 2
  properties:
    port:
      type: string
      title: Serial port
      default: COM3
      x-group: connection
      x-settings-path: transport/port
      x-widget: serialPortPreview
      description: Example device model. No hardware enumeration or connection is performed.
      x-order: 0
    baudRate:
      type: integer
      title: Baud rate
      default: 115200
      x-group: connection
      x-settings-path: transport/baudRate
      enum:
      - 9600
      - 19200
      - 38400
      - 57600
      - 115200
      - 230400
      - 460800
      - 921600
      x-order: 1
    dataBits:
      type: integer
      title: Data bits
      default: 8
      x-group: line
      x-settings-path: transport/dataBits
      enum:
      - 5
      - 6
      - 7
      - 8
      x-order: 2
    parity:
      type: string
      title: Parity
      default: None
      x-group: line
      x-settings-path: transport/parity
      enum:
      - None
      - Odd
      - Even
      - Mark
      - Space
      x-order: 3
    stopBits:
      type: string
      title: Stop bits
      default: '1'
      x-group: line
      x-settings-path: transport/stopBits
      enum:
      - '1'
      - '1.5'
      - '2'
      x-order: 4
    flowControl:
      type: string
      title: Flow control
      default: None
      x-group: line
      x-settings-path: transport/flowControl
      enum:
      - None
      - RTS/CTS
      - XON/XOFF
      x-order: 5
    dtr:
      type: boolean
      title: Data terminal ready (DTR)
      default: true
      x-group: advanced
      x-settings-path: transport/dtr
      x-order: 6
    rts:
      type: boolean
      title: Request to send (RTS)
      default: false
      x-group: advanced
      x-settings-path: transport/rts
      x-order: 7
    readBuffer:
      type: integer
      title: Read buffer (KiB)
      default: 64
      x-group: advanced
      x-settings-path: transport/readBuffer
      minimum: 4
      maximum: 4096
      x-order: 8
    timeout:
      type: integer
      title: Read timeout (ms)
      default: 1000
      x-group: advanced
      x-settings-path: transport/timeout
      minimum: 0
      maximum: 60000
      x-order: 9
