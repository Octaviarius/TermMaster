version: 1
type: termaster.settings-schema
description: Session layout preview settings
content:
  $schema: http://json-schema.org/draft-07/schema#
  type: object
  title: Session layout
  additionalProperties: false
  required:
  - name
  - terminals
  - arrangement
  - ratio
  - selected
  - restore
  - connect
  x-groups:
  - id: identity
    title: Session
    order: 0
  - id: layout
    title: Arrangement
    order: 1
  - id: startup
    title: Startup
    order: 2
  properties:
    name:
      type: string
      title: Display name
      default: Amber Falcon
      x-group: identity
      x-settings-path: identity/name
      minLength: 1
      x-order: 0
    terminals:
      type: integer
      title: Configured terminals
      default: 2
      x-group: identity
      x-settings-path: identity/terminals
      readOnly: true
      x-order: 1
    arrangement:
      type: string
      title: Terminal arrangement
      default: Side by side
      x-group: layout
      x-settings-path: layout/arrangement
      enum:
      - Side by side
      - Stacked
      - Tabs
      x-order: 2
    ratio:
      type: integer
      title: First pane width (%)
      default: 50
      x-group: layout
      x-settings-path: layout/ratio
      minimum: 10
      maximum: 90
      x-order: 3
    selected:
      type: string
      title: Initially selected terminal
      default: Board console
      x-group: layout
      x-settings-path: layout/selected
      enum:
      - Board console
      - Boot log
      x-order: 4
    restore:
      type: boolean
      title: Restore window layout
      default: true
      x-group: startup
      x-settings-path: startup/restoreLayout
      x-order: 5
    connect:
      type: boolean
      title: Connect when session opens
      default: false
      x-group: startup
      x-settings-path: startup/connect
      x-order: 6
