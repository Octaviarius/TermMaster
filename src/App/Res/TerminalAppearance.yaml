version: 1
type: termaster.settings-schema
description: Terminal display and input settings
content:
  $schema: http://json-schema.org/draft-07/schema#
  type: object
  x-widget: terminalPreview
  x-widget-options:
    title: Terminal preview
  additionalProperties: false
  required:
  - fontFamily
  - fontSize
  - foreground
  - background
  - scrollback
  - localEcho
  x-groups:
  - id: text
    title: Text
    order: 0
  - id: colors
    title: Colors
    order: 1
  - id: screen
    title: Screen
    order: 2
  - id: input
    title: Input
    order: 3
  properties:
    fontFamily:
      type: string
      title: Font family
      default: Consolas
      minLength: 1
      maxLength: 128
      x-widget: fontFamily
      x-settings-path: appearance/fontFamily
      x-group: text
      x-order: 0
    fontSize:
      type: number
      title: Font size (pt)
      default: 12
      minimum: 6
      maximum: 72
      x-settings-path: appearance/fontSize
      x-group: text
      x-order: 1
    foreground:
      type: string
      title: Foreground color
      default: '#e5e7eb'
      pattern: ^#[0-9a-fA-F]{6}$
      x-widget: color
      x-settings-path: appearance/foreground
      x-group: colors
      x-order: 2
    background:
      type: string
      title: Background color
      default: '#15191f'
      pattern: ^#[0-9a-fA-F]{6}$
      x-widget: color
      x-settings-path: appearance/background
      x-group: colors
      x-order: 3
    scrollback:
      type: integer
      title: Scrollback lines
      default: 10000
      minimum: 100
      maximum: 100000
      x-settings-path: appearance/scrollbackLines
      x-group: screen
      x-order: 4
    localEcho:
      type: boolean
      title: Local echo
      default: false
      x-settings-path: input/localEcho
      x-group: input
      x-order: 5
    inputMode:
      type: string
      title: Input mode
      enum: [interactive, buffered]
      default: interactive
      x-widget: enumCombo
      x-settings-path: input/mode
      x-group: input
      x-order: 6
    terminator:
      type: string
      title: Command terminator
      enum: [lf, crlf, cr, nul, none, custom]
      default: cr
      x-widget: enumCombo
      x-settings-path: input/terminator
      x-group: input
      x-order: 7
    customTerminator:
      type: string
      title: Custom terminator (escaped bytes)
      default: ''
      maxLength: 1024
      x-widget: stringLineEdit
      x-settings-path: input/customTerminator
      x-group: input
      x-order: 8
    pastePolicy:
      type: string
      title: Paste policy
      enum: [edit, immediate]
      default: edit
      x-widget: enumCombo
      x-settings-path: input/pastePolicy
      x-group: input
      x-order: 10
    disconnectedPolicy:
      type: string
      title: Disconnected sending
      enum: [reject, retain]
      default: reject
      x-widget: enumCombo
      x-settings-path: input/disconnectedPolicy
      x-group: input
      x-order: 14
    periodMs:
      type: integer
      title: Periodic interval (ms)
      default: 1000
      minimum: 100
      maximum: 86400000
      x-settings-path: input/periodMs
      x-group: input
      x-order: 15
    favorites:
      type: array
      title: Favorite commands
      default: []
      maxItems: 100
      items:
        type: object
        required: [name, text, terminator]
        properties:
          name: {type: string, minLength: 1, maxLength: 128}
          text: {type: string, maxLength: 16384}
          terminator: {type: string, enum: [lf, crlf, cr, nul, none, custom]}
          customTerminator: {type: string, maxLength: 1024}
      x-widget: commandFavorites
      x-settings-path: input/favorites
      x-group: input
      x-order: 16
