version: 1
type: termaster.settings-schema
description: Interface and behavior preview settings
content:
  $schema: http://json-schema.org/draft-07/schema#
  type: object
  title: Interface and behavior
  additionalProperties: false
  required:
  - theme
  - language
  - restoreWorkspace
  - confirmExit
  - recentLimit
  x-groups:
  - id: interface
    title: Interface
    order: 0
  - id: startup
    title: Startup
    order: 1
  - id: history
    title: History
    order: 2
  properties:
    theme:
      type: string
      title: Color theme
      default: System
      x-group: interface
      x-settings-path: ui/theme
      enum:
      - System
      - Light
      - Dark
      x-order: 0
    language:
      type: string
      title: Interface language
      default: English
      x-group: interface
      x-settings-path: ui/language
      enum:
      - English
      - Russian
      x-order: 1
    restoreWorkspace:
      type: boolean
      title: Restore last workspace
      default: true
      x-group: startup
      x-settings-path: startup/restoreWorkspace
      x-order: 2
    confirmExit:
      type: boolean
      title: Confirm before closing
      default: true
      x-group: startup
      x-settings-path: startup/confirmExit
      x-order: 3
    recentLimit:
      type: integer
      title: Recent items
      default: 10
      x-group: history
      x-settings-path: history/limit
      minimum: 1
      maximum: 20
      x-order: 4
