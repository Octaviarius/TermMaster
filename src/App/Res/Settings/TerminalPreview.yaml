version: 1
type: termaster.settings-schema
description: Text and screen preview settings
content:
  $schema: http://json-schema.org/draft-07/schema#
  type: object
  title: Text and screen
  additionalProperties: false
  required:
  - font
  - fontSize
  - theme
  - cursor
  - scrollback
  - wrap
  - encoding
  - echo
  x-groups:
  - id: text
    title: Text
    order: 0
  - id: screen
    title: Screen
    order: 1
  - id: input
    title: Input and output
    order: 2
  properties:
    font:
      type: string
      title: Font family
      default: Cascadia Mono
      x-group: text
      x-settings-path: text/font
      enum:
      - Cascadia Mono
      - Consolas
      - Monospace
      x-order: 0
    fontSize:
      type: integer
      title: Font size (pt)
      default: 14
      x-group: text
      x-settings-path: text/fontSize
      minimum: 8
      maximum: 32
      x-order: 1
    theme:
      type: string
      title: Color scheme
      default: Dark
      x-group: text
      x-settings-path: text/theme
      enum:
      - Dark
      - Light
      - Solarized
      x-order: 2
    cursor:
      type: string
      title: Cursor shape
      default: Block
      x-group: screen
      x-settings-path: screen/cursor
      enum:
      - Block
      - Underline
      - Bar
      x-order: 3
    scrollback:
      type: integer
      title: Scrollback lines
      default: 100000
      x-group: screen
      x-settings-path: screen/scrollback
      minimum: 1000
      maximum: 1000000
      x-order: 4
    wrap:
      type: boolean
      title: Wrap long lines
      default: true
      x-group: screen
      x-settings-path: screen/wrap
      x-order: 5
    encoding:
      type: string
      title: Text encoding
      default: UTF-8
      x-group: input
      x-settings-path: encoding
      enum:
      - UTF-8
      - Windows-1251
      - ISO-8859-1
      x-order: 6
    echo:
      type: boolean
      title: Local echo
      default: false
      x-group: input
      x-settings-path: input/localEcho
      x-order: 7
