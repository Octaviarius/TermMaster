version: 1
type: termaster.settings-schema
description: Application display and terminal group controls
content:
  $schema: http://json-schema.org/draft-07/schema#
  title: Display
  type: object
  additionalProperties: false
  required: [statusBar]
  x-groups:
    - id: appearance
      title: Appearance
      order: 0
    - id: terminalGroups
      title: Terminal group controls
      order: 1
  properties:
    statusBar:
      type: boolean
      title: Show status bar
      description: Show the status bar for the application.
      default: true
      x-settings-path: ui/statusBarVisible
      x-group: appearance
      x-order: 1
    embeddedToolbar:
      type: array
      title: Embedded group toolbar
      description: >-
        Ordered action selectors. A group selector includes its registered action group;
        a command selector selects an exact registered command. An empty list hides all buttons.
      default: [group:connection, command:Terminal.LocalEcho, command:View.WrapLines, group:settings]
      items:
        type: string
        maxLength: 128
        pattern: '^(group|command):[A-Za-z0-9_.-]+$'
      maxItems: 64
      uniqueItems: true
      x-settings-path: ui/terminalGroups/embedded/toolbar
      x-widget: actionLayout
      x-group: terminalGroups
      x-order: 0
    embeddedStatus:
      type: array
      title: Embedded group status bar
      description: >-
        Ordered action selectors. A group selector includes its registered action group;
        a command selector selects an exact registered command. An empty list hides all buttons.
      default: [command:Terminal.BufferedInput, command:Terminal.SendFile, command:Terminal.Processing]
      items:
        type: string
        maxLength: 128
        pattern: '^(group|command):[A-Za-z0-9_.-]+$'
      maxItems: 64
      uniqueItems: true
      x-settings-path: ui/terminalGroups/embedded/status
      x-widget: actionLayout
      x-group: terminalGroups
      x-order: 1
    secondaryToolbar:
      type: array
      title: Secondary window group toolbar
      description: >-
        Ordered action selectors. A group selector includes its registered action group;
        a command selector selects an exact registered command. An empty list hides all buttons.
      default: [group:connection, command:Terminal.LocalEcho, command:View.WrapLines, group:settings]
      items:
        type: string
        maxLength: 128
        pattern: '^(group|command):[A-Za-z0-9_.-]+$'
      maxItems: 64
      uniqueItems: true
      x-settings-path: ui/terminalGroups/secondary/toolbar
      x-widget: actionLayout
      x-group: terminalGroups
      x-order: 2
    secondaryStatus:
      type: array
      title: Secondary window group status bar
      description: >-
        Ordered action selectors. A group selector includes its registered action group;
        a command selector selects an exact registered command. An empty list hides all buttons.
      default: [command:Terminal.BufferedInput, command:Terminal.SendFile, command:Terminal.Processing]
      items:
        type: string
        maxLength: 128
        pattern: '^(group|command):[A-Za-z0-9_.-]+$'
      maxItems: 64
      uniqueItems: true
      x-settings-path: ui/terminalGroups/secondary/status
      x-widget: actionLayout
      x-group: terminalGroups
      x-order: 3
