version: 1
type: termaster.settings-schema
description: Application display settings
content:
  $schema: http://json-schema.org/draft-07/schema#
  title: Display
  type: object
  additionalProperties: false
  required: [toolbar, statusBar]
  x-groups:
    - id: appearance
      title: Appearance
      order: 0
  properties:
    toolbar:
      type: boolean
      title: Show toolbar
      description: Show the main action toolbar for the application.
      default: true
      x-settings-path: ui/toolbarVisible
      x-group: appearance
      x-order: 0
    statusBar:
      type: boolean
      title: Show status bar
      description: Show the status bar for the application.
      default: true
      x-settings-path: ui/statusBarVisible
      x-group: appearance
      x-order: 1
